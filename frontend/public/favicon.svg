<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient -->
    <linearGradient id="oGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#000000" rx="12"/>
  
  <!-- Outer glow ring -->
  <circle 
    cx="32" 
    cy="32" 
    r="22" 
    fill="none" 
    stroke="#d8b4fe" 
    stroke-width="1.5"
    opacity="0.6"
  />
  
  <!-- Main bold O ring -->
  <circle 
    cx="32" 
    cy="32" 
    r="18" 
    fill="none" 
    stroke="url(#oGradient)" 
    stroke-width="7"
  />
  
  <!-- Inner ring for depth -->
  <circle 
    cx="32" 
    cy="32" 
    r="12" 
    fill="none" 
    stroke="url(#oGradient)" 
    stroke-width="2.5"
    opacity="0.4"
  />
  
  <!-- Accent dots -->
  <circle cx="43" cy="26" r="1.5" fill="#d8b4fe" opacity="0.8"/>
  <circle cx="43" cy="38" r="1" fill="#d8b4fe" opacity="0.5"/>
</svg>
