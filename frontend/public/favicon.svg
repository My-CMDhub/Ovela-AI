<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF8C94" /> <!-- Soft Coral Pink -->
            <stop offset="100%" stop-color="#FF5E62" /> <!-- Warm Red-Pink -->
        </linearGradient>
        <linearGradient id="softGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF9A9E" />
            <stop offset="100%" stop-color="#FECFEF" />
        </linearGradient>
        <linearGradient id="deepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D45D79" />
            <stop offset="100%" stop-color="#E5989B" />
        </linearGradient>
    </defs>
    <!-- Bottom shape -->
    <path d="M32 58C46.3594 58 58 46.3594 58 32C58 25.5 55 20 50 16" stroke="url(#deepGradient)"
        stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Top shape, interlocking -->
    <path d="M32 6C17.6406 6 6 17.6406 6 32C6 38.5 9 44 14 48" stroke="url(#warmGradient)" stroke-width="6"
        stroke-linecap="round" />
    <!-- Connecting "Glass" elements -->
    <circle cx="32" cy="32" r="18" stroke="url(#softGradient)" stroke-width="12" stroke-opacity="0.2" />
    <circle cx="14" cy="48" r="3" fill="url(#warmGradient)" />
    <circle cx="50" cy="16" r="3" fill="url(#deepGradient)" />
</svg>
